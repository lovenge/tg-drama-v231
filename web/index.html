<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>影视仓库</title><style>
:root{--bg:#0b1020;--panel:#151d30;--muted:#9aa8bd;--text:#eef3fb;--accent:#e9b44c;--bad:#ff9c9c;--ok:#7fe0b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Microsoft Yahei",sans-serif}header{position:sticky;top:0;z-index:3;background:#0b1020ed;border-bottom:1px solid #25314a;backdrop-filter:blur(12px)}.bar{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:14px}.brand{font-weight:800;font-size:20px;white-space:nowrap}.brand b{color:var(--accent)}.spacer{flex:1}input{background:#151d30;border:1px solid #33415c;border-radius:12px;color:white;padding:11px 13px;min-width:0}.search{width:min(330px,48vw)}button,.tab{border:0;border-radius:10px;padding:10px 14px;background:#25314a;color:#dfe8f7;cursor:pointer}.tab.active{background:var(--accent);color:#171717;font-weight:800}main{max-width:1200px;margin:auto;padding:22px 18px 60px}.hero{padding:22px;border-radius:18px;background:linear-gradient(120deg,#202b44,#151d30 65%,#352a22);margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:clamp(24px,4vw,34px)}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}.card{cursor:pointer;min-width:0}.poster{aspect-ratio:2/3;border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#293750,#171e2c);display:flex;align-items:center;justify-content:center;color:#71819c;font-size:42px}.poster img{width:100%;height:100%;object-fit:cover}.name{font-weight:700;margin:8px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:50px 10px;color:var(--muted)}.detail{display:none}.back{margin-bottom:15px}.detail-head{display:flex;gap:20px;margin:12px 0 24px}.detail-poster{width:150px;flex:none;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:#25314a}.detail-poster img{width:100%;height:100%;object-fit:cover}.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}.ep{display:block;text-decoration:none;text-align:center;padding:14px 8px;border:1px solid #34415a;border-radius:11px;background:#151d30;color:white}.ep:hover{border-color:var(--accent)}.player-wrap{display:none;margin:18px 0 24px;padding:12px;background:#151d30;border:1px solid #34415a;border-radius:14px}.player-wrap video{width:100%;max-height:65vh;background:#000;border-radius:10px}.player-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.player-actions a,.player-actions button{color:var(--accent);font-size:13px}.player-actions button{background:#25314a;color:#dfe8f7;padding:7px 11px}.pstate{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}.pstate b{color:var(--ok)}.errbox{display:none;margin-top:12px;padding:12px;border-radius:11px;background:#2a1a1f;border:1px solid #6b3a44;color:#ffd9d9;font-size:13px;line-height:1.7}.errbox .why{color:var(--bad);font-weight:700}.errbox code{background:#1b1116;padding:2px 5px;border-radius:5px;font-size:12px;word-break:break-all}footer{text-align:center;color:#6f7d94;font-size:12px;padding:24px}@media(max-width:560px){.bar{flex-wrap:wrap}.brand{font-size:18px}.search{order:3;width:100%}.detail-head{gap:14px}.detail-poster{width:112px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.name{font-size:13px}}
</style></head><body><header><div class="bar"><div class="brand">🎬 影视<b>仓库</b></div><div class="spacer"></div><input id="search" class="search" placeholder="搜索片名…" oninput="load()"><a href="/admin" style="color:#9aa8bd;text-decoration:none;font-size:13px">管理</a></div></header><main><section id="home"><div class="hero"><h1>发现好剧 · 随时开看</h1><div class="muted">来自 Telegram 频道的影视索引 · 点击集数即可网页在线播放</div><div id="stats" class="muted" style="margin-top:12px;font-size:13px">正在统计影视库…</div></div><nav class="tabs"><button class="tab active" data-cat="" onclick="choose(this)">全部</button><button class="tab" data-cat="short_drama" onclick="choose(this)">短剧</button><button class="tab" data-cat="tv" onclick="choose(this)">电视剧</button><button class="tab" data-cat="movie" onclick="choose(this)">电影</button><button class="tab" data-cat="other" onclick="choose(this)">待整理</button></nav><div id="count" class="muted" style="font-size:13px;margin:0 0 14px"></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>暂时没有找到作品</div></section><section id="detail" class="detail"><button class="back" onclick="showHome()">← 返回影视库</button><div class="detail-head"><div id="dp" class="detail-poster"></div><div><h2 id="dt"></h2><div id="dm" class="muted"></div><p class="muted">选择集数后，可直接在网页播放器中观看。</p></div></div><div id="playerWrap" class="player-wrap"><div id="playingTitle" style="font-weight:700;margin:2px 0 10px">正在播放</div><video id="videoPlayer" controls playsinline preload="metadata" crossorigin="anonymous"></video><div class="pstate" id="playState">准备中…</div><div class="errbox" id="errBox"></div><div class="player-actions"><a id="telegramFallback" href="#" target="_blank" rel="noopener">原 Telegram 消息</a><a id="downloadLink" href="#" download>下载原片</a><button onclick="playAuto()">原画质</button><button onclick="playQuality(480)">流畅480p（外网省流）</button><button onclick="closePlayer()">关闭播放器</button></div></div><h3>全部集数</h3><div id="eps" class="episodes"></div></section></main><footer>TG 影视仓库 V2.5 · 仅保存索引与封面；视频按需从 Telegram 读取，不落地</footer><script>
let category='',items=[],searchTimer=null,watchdog=null,currentEp=null;
function choose(b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');category=b.dataset.cat;load()}
function poster(url,title){return url?`<img loading="lazy" src="${url}" alt="">`:`<span>${(title||'影').slice(0,1)}</span>`}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function catName(c){return ({short_drama:'短剧',tv:'电视剧',movie:'电影',other:'待整理'})[c]||'影视'}
function fmtSize(n){if(!n)return'未知大小';const u=['B','KB','MB','GB'];let i=0,v=n;while(v>=1024&&i<u.length-1){v/=1024;i++}return v.toFixed(v>=10||i===0?0:1)+u[i]}
async function jsonOrError(r){let t=await r.text(),d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok){const m=(d&&d.detail)?d.detail:(typeof d==='string'?d:'请求失败');throw new Error(m)}return d}
async function load(){const q=document.getElementById('search').value.trim();const p=new URLSearchParams({limit:200});if(category)p.set('category',category);if(q)p.set('q',q);try{let r=await fetch('/api/dramas?'+p);items=await jsonOrError(r);document.getElementById('count').textContent=`找到 ${items.length} 部作品`;document.getElementById('grid').innerHTML=items.map(x=>`<article class="card" onclick="openDrama(${x.id})"><div class="poster">${poster(x.cover_url,x.title)}</div><div class="name" title="${esc(x.title)}">${esc(x.title)}</div><div class="meta">${catName(x.category)} · ${x.episode_count||0}${x.category==='movie'?' 条资源':' 集'}</div></article>`).join('');document.getElementById('empty').hidden=items.length>0}catch(e){document.getElementById('grid').innerHTML='<div class="empty">读取失败：'+esc(e.message)+'</div>'}}
async function openDrama(id){let x=await jsonOrError(await fetch('/api/dramas/'+id));document.getElementById('home').style.display='none';document.getElementById('detail').style.display='block';document.getElementById('dt').textContent=x.drama.title;let src=(x.sources||[]).map(s=>'@'+s.username).join('、');document.getElementById('dm').textContent=catName(x.drama.category)+' · '+x.episodes.length+' 条资源'+(src?' · 来源 '+src:'');closePlayer();document.getElementById('dp').innerHTML=poster(x.drama.cover_url,x.drama.title);document.getElementById('eps').innerHTML=x.episodes.map(e=>`<button class="ep" onclick="playEpisode(${e.id},${e.episode_number||0})">${e.episode_number?'第 '+e.episode_number+' 集':'播放资源'}<div class="meta">${esc(e.quality||'在线播放')}</div></button>`).join('')||'<div class="empty">暂无集数</div>';window.scrollTo(0,0)}
function setState(html){document.getElementById('playState').innerHTML=html}
function showError(title,detail,extra){const box=document.getElementById('errBox');box.style.display='block';box.innerHTML=`<div class="why">${esc(title)}</div>${detail?`<div>${esc(detail)}</div>`:''}${extra||''}`}
function hideError(){const box=document.getElementById('errBox');box.style.display='none';box.innerHTML=''}
function clearWatchdog(){if(watchdog){clearTimeout(watchdog);watchdog=null}}
function modeName(m){return ({direct:'直连播放',remux:'转封装播放',transcode:'转码播放',download:'无法在线播放'})[m]||m||''}
async function playEpisode(id,episodeNo,forcedMode,height){const label=episodeNo?'第 '+episodeNo+' 集':'播放资源';const wrap=document.getElementById('playerWrap'),video=document.getElementById('videoPlayer');currentEp=id;curNo=episodeNo||0;clearWatchdog();hideError();video.pause();video.removeAttribute('src');video.load();wrap.style.display='block';document.getElementById('playingTitle').textContent=label+(height?`（流畅 ${height}p）`:'');setState('正在读取媒体信息…'+(forcedMode?`（${forcedMode}${height?` ${height}p`:''}）`:''));wrap.scrollIntoView({behavior:'smooth',block:'start'});
try{
 const qs=[];if(forcedMode)qs.push('mode='+forcedMode);if(height)qs.push('height='+height);
 const info=await jsonOrError(await fetch('/api/episodes/'+id+'/play'+(qs.length?'?'+qs.join('&'):'')));
 document.getElementById('telegramFallback').href=info.fallback_url||'#';
 document.getElementById('downloadLink').href=info.download_url||('#');
 if(info.mode==='download'){setState('该文件无法在浏览器中播放');showError(info.reason||'浏览器不支持该视频编码',info.note||'',`<div style="margin-top:8px">已提供下载入口：<a href="${info.download_url}" download style="color:#e9b44c">下载原片</a>，或用“原 Telegram 消息”在 Telegram 内观看。</div>`);return}
 setState(`<b>${modeName(info.mode)}</b>${height?` · ${height}p`:''} · ${esc(info.container||'')} ${esc((info.video_codec||'').toUpperCase())}/${esc((info.audio_codec||'').toUpperCase())} · ${fmtSize(info.size)}${info.seekable?' · 支持拖动':' · 该模式暂不支持拖动'}${info.note?' · '+esc(info.note):''}`);
 video.src=info.url;video.load();
 const p=video.play();
 if(p&&p.catch) p.catch(()=>{});
 watchdog=setTimeout(()=>{if(video.readyState<1)diagnose(id,'45 秒内没有收到可播放的数据')},45000);
}catch(e){clearWatchdog();setState('启动播放失败');showError('无法启动在线播放',e.message,`<div style="margin-top:8px"><button onclick="playEpisode(${id},${episodeNo||0})">重试</button> <button onclick="playEpisode(${id},${episodeNo||0},'transcode')">强制转封装重试</button></div>`) } }
function playQuality(h){if(currentEp==null)return;playEpisode(currentEp,curNo,'transcode',h)}
function playAuto(){if(currentEp==null)return;playEpisode(currentEp,curNo)}
document.getElementById('videoPlayer').addEventListener('loadedmetadata',()=>{clearWatchdog();hideError()});
document.getElementById('videoPlayer').addEventListener('canplay',()=>{clearWatchdog()});
document.getElementById('videoPlayer').addEventListener('error',()=>{const v=document.getElementById('videoPlayer');const codes={1:'播放被中止',2:'网络错误，数据中断',3:'解码失败，编码可能不被浏览器支持',4:'视频格式或编码不支持'};const m=codes[v.error&&v.error.code]||'播放器无法解码该视频';diagnose(currentEp,m)});
async function diagnose(id,reason){clearWatchdog();setState('播放异常');let extra='';try{const p=await jsonOrError(await fetch('/api/episodes/'+id+'/probe'));const run=p.last_run||{};extra=`<div style="margin-top:8px;color:#9aa8bd">容器 <code>${esc(p.container||'未知')}</code> · 视频 <code>${esc(p.video_codec||'未知')}</code> · 音频 <code>${esc(p.audio_codec||'未知')}</code> · 方案 <code>${esc(p.mode||'')}</code><br>已读 ${fmtSize(run.bytes||0)}${run.first_byte_ms?` · 首字节 ${run.first_byte_ms}ms`:''}${run.last_error?` · 最近错误：${esc(run.last_error)}`:''}</div>`}catch(e){}
showError('视频没有播出来：'+reason, '常见原因：HEVC/H.265 编码、MKV/AC3 封装不被浏览器支持；或 NAS 到 Telegram 读取过慢。', extra+`<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button onclick="playEpisode(${id},0)">重试</button><button onclick="playEpisode(${id},0,'transcode')">强制转封装重试</button><a href="/api/episodes/${id}/download" download style="color:#e9b44c;padding:7px 11px;border:1px solid #6b3a44;border-radius:9px;text-decoration:none">下载原片</a><a href="/api/episodes/${id}/probe" target="_blank" style="color:#9aa8bd;padding:7px 11px">查看诊断 JSON</a></div>`)}
function closePlayer(){clearWatchdog();const w=document.getElementById('playerWrap'),v=document.getElementById('videoPlayer');v.pause();v.removeAttribute('src');v.load();w.style.display='none';hideError();currentEp=null}
function showHome(){closePlayer();document.getElementById('detail').style.display='none';document.getElementById('home').style.display='block'}
async function loadStats(){try{let s=await jsonOrError(await fetch('/api/stats'));document.getElementById('stats').textContent=`共 ${s.dramas} 部作品 · ${s.episodes} 条资源 · ${s.channels} 个频道 · 待补封面 ${s.missing_covers} 部`}catch(e){document.getElementById('stats').textContent='影视库统计暂不可用'}}
document.getElementById('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(load,250)});loadStats();load();
</script></body></html>
